<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5dce8"><title>给你一整个星河的祝福</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#080816;color:white}button{font:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:3px solid #e6a9e4;outline-offset:5px}[hidden]{display:none!important}
.screen{position:fixed;inset:0;min-height:100svh;overflow:hidden}#heart{background:radial-gradient(ellipse at 35% 30%,#fff8e9,transparent 55%),radial-gradient(ellipse at 80% 60%,#e7c6f4,transparent 60%),#f8dce7;color:#9b4271;transition:opacity .9s;z-index:2}.heading{position:absolute;top:max(9%,55px);width:100%;text-align:center;z-index:3;pointer-events:none}h1{font-family:Georgia,"Songti SC",serif;font-size:clamp(34px,9vw,60px);margin:0 0 14px;letter-spacing:.12em;font-weight:500}.heading p{font-size:13px;letter-spacing:.2em;opacity:.75}.heart-area{position:absolute;left:50%;top:49%;width:min(86vw,560px);height:min(83vw,530px);transform:translate(-50%,-50%)}.note{position:absolute;width:clamp(80px,21vw,132px);height:clamp(43px,11vw,67px);border:1px solid #ffffffd9;border-radius:5px;background:var(--color);box-shadow:0 3px 10px #73466420;color:#654d61;text-align:center;font-size:clamp(9px,2.4vw,13px);display:flex;align-items:center;justify-content:center;padding:12px 4px 4px;opacity:0;transform:translate(var(--sx),var(--sy)) rotate(var(--angle));animation:arrive .8s cubic-bezier(.2,.75,.2,1) forwards;animation-delay:var(--delay)}.note:before{content:"● ● ●";position:absolute;left:5px;top:3px;font-size:5px;letter-spacing:2px;opacity:.35}.note:after{content:"";position:absolute;top:13px;left:0;right:0;border-top:1px solid #ffffff80}@keyframes arrive{to{opacity:1;transform:translate(-50%,-50%) rotate(var(--angle))}}.center-note{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);width:155px;padding:22px 10px;background:#fff9f2ed;box-shadow:0 8px 30px #b9719c35;text-align:center;border:1px solid white;border-radius:5px;z-index:100;opacity:0;animation:reveal 1s 4.6s forwards;color:#b34d7f}.center-note strong{font-size:21px}.center-note small{display:block;font-size:10px;margin-top:12px;line-height:1.9;letter-spacing:.1em}@keyframes reveal{to{opacity:1}}.bottom{position:absolute;bottom:max(8%,35px);left:18px;right:18px;display:flex;flex-direction:column;align-items:center;gap:14px;z-index:5}.pill{border:1px solid #ffffff60;background:#ffffff16;color:#f7e5ff;border-radius:30px;padding:13px 25px;font-size:14px;backdrop-filter:blur(12px)}#enter{background:#a44775;color:#fff;border:1px solid #a44775;box-shadow:0 8px 24px #a4477535}.caption{font-size:11px;letter-spacing:.15em;opacity:.65}canvas{width:100%;height:100%;display:block;touch-action:pan-y}#galaxy .heading{top:max(9%,55px)}#galaxy h1{font-size:clamp(28px,7vw,45px);color:#f6dcff;text-shadow:0 0 30px #cd71c8}#galaxy .heading p{color:#d2b8dc}.topbar{position:absolute;top:max(20px,env(safe-area-inset-top));left:20px;right:20px;display:flex;justify-content:space-between;z-index:6}.small{background:#ffffff08;border:1px solid #ffffff28;border-radius:30px;color:#dfcfe8;padding:9px 13px;font-size:11px}.controls{display:flex;gap:10px}.letter-wrap{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:25px;background:#070914a8;backdrop-filter:blur(9px)}.letter{width:min(100%,350px);max-height:85svh;overflow:auto;text-align:center;padding:32px 24px;border:1px solid #e0b0e850;border-radius:20px;background:linear-gradient(150deg,#32213ded,#17172dee);box-shadow:0 0 70px #c96cef25}.letter h2{font-family:Georgia,"Songti SC",serif;font-size:27px;color:#ffd5eb}.letter p{font-size:14px;line-height:2.2;color:#e0cce5;margin:24px 0}.letter .star{font-size:35px;color:#f4d3a0} @media(prefers-reduced-motion:reduce){.note{animation-duration:.01ms;animation-delay:0s}.center-note{animation-delay:0s}.screen{transition:none}}
#intro{z-index:8;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 38%,#40304f 0%,#171528 45%,#080816 85%);text-align:center}
.intro-content{display:flex;flex-direction:column;align-items:center;padding:30px;gap:26px}
.intro-eyebrow{font-size:10px;letter-spacing:.4em;color:#dcb7d6}
.intro-title{font-family:Georgia,"Songti SC",serif;font-weight:400;font-size:clamp(27px,7vw,42px);letter-spacing:.13em;margin:0;color:#ffe4ef}
.intro-sub{color:#c5b6d0;font-size:13px;line-height:2;letter-spacing:.12em;margin:0}
#open-surprise{display:flex;flex-direction:column;align-items:center;gap:30px;border:0;background:transparent;color:#ffe4ef;padding:25px;min-width:240px;font-size:15px;letter-spacing:.16em}
.envelope{position:relative;display:grid;place-items:center;width:132px;height:92px;border:1px solid #f1c6dc99;border-radius:9px;background:linear-gradient(145deg,#d79abb33,#846ba533);box-shadow:0 0 60px #edb3df20;animation:envelope-float 3s ease-in-out infinite}
.envelope:before{content:"";position:absolute;width:89px;height:89px;border-right:1px solid #eac0db99;border-bottom:1px solid #eac0db99;transform:translateY(-45px) rotate(45deg);border-radius:0 0 9px 0}
.envelope span{position:relative;margin-top:20px;font-size:27px;color:#ffcae0;text-shadow:0 0 18px #ffa6d5}
.intro-hint{font-size:10px;color:#a69bb7;letter-spacing:.2em}
@keyframes envelope-float{50%{transform:translateY(-9px);box-shadow:0 12px 70px #edb3df35}}
#heart:not(.started) .note,#heart:not(.started) .center-note{animation-play-state:paused}
@media(prefers-reduced-motion:reduce){.envelope{animation:none}}
.galaxy-tools{display:flex;gap:6px}
#music{white-space:nowrap}
@media(max-width:360px){#galaxy .topbar{left:10px;right:10px}#galaxy .topbar .small{padding-inline:9px}}
.letter-line{display:block}
.letter-wrap:not([hidden]) .letter-line{
 animation:letter-appear .55s ease-out both;
 animation-delay:calc(.15s + var(--line) * .44s);
}
@keyframes letter-appear{
 from{opacity:0;transform:translateY(6px)}
 to{opacity:1;transform:translateY(0)}
}
@media(prefers-reduced-motion:reduce){
 .letter-wrap:not([hidden]) .letter-line{animation:none}
}
</style></head><body>
<section class="screen" id="intro" aria-label="开启生日惊喜"><div class="intro-content"><span class="intro-eyebrow">A LITTLE SURPRISE FOR YOU</span><h1 class="intro-title">有一份心意，等你查收</h1><p class="intro-sub">今天的星光和祝福<br>都为你而来</p><button id="open-surprise"><span class="envelope" aria-hidden="true"><span>♡</span></span><span>轻触，开启惊喜</span></button><span class="intro-hint">愿你的今天，比昨天更快乐</span></div></section>
<section class="screen" id="heart" hidden><div class="heading"><h1>生日快乐</h1><p>把所有美好的祝福，都送给你</p></div><div class="heart-area" id="notes"><div class="center-note"><strong>生日快乐 ♡</strong><small>愿你新的一岁<br>继续闪闪发光</small></div></div><div class="bottom"><button class="pill" id="enter">收下祝福，去看星河 ✦</button><span class="caption">今天的惊喜，为你准备</span></div></section>
<section class="screen" id="galaxy" hidden><canvas id="sky" aria-label="星空中由发光粒子组成的立体生日蛋糕"></canvas><div class="topbar"><button class="small" id="back">♡ 回到祝福</button><div class="galaxy-tools">
  <button class="small" id="color">换一种星光</button>
  <button class="small" id="music" type="button">♫ 播放音乐</button>
</div></div><div class="heading"><h1 id="cake-title">星河为你亮起</h1><p id="cake-sub">闭上眼睛，许下新一岁的愿望</p></div><div class="bottom"><div class="controls"><button class="pill" id="blow">许愿 · 吹灭蜡烛</button><button class="pill" id="read" hidden>拆开生日小信 ♡</button><button class="small" id="again" hidden>重新点亮</button></div><span class="caption">指尖轻划，让星河围着蛋糕转动</span></div></section>
<div class="letter-wrap" id="letter-wrap" hidden>
  <section class="letter" role="dialog" aria-modal="true" aria-labelledby="letter-title">
    <div class="star">✦</div>
    <h2 class="letter-line" id="letter-title" style="--line:0">生日快乐</h2>
    <p>
      <span class="letter-line" style="--line:1">愿你新的一岁，</span>
      <span class="letter-line" style="--line:2">有热爱的事，有惦记的人，</span>
      <span class="letter-line" style="--line:3">有说走就走的勇气，</span>
      <span class="letter-line" style="--line:4">也有慢慢生活的底气。</span>
    </p>
    <p>
      <span class="letter-line" style="--line:5">愿你抬头有星光，身边有温暖。</span>
      <span class="letter-line" style="--line:6">刚刚许下的愿望，</span>
      <span class="letter-line" style="--line:7">都在未来的某一天，悄悄实现。</span>
    </p>
    <button class="pill" id="close">收好这份祝福 ♡</button>
  </section>
</div>

 ctx.drawImage(nebula,cx-radius,cy-oval,2*radius,bodyBottom-cy+2*oval);
 ctx.restore();
 disc(cx,cy,cakeRadius,tilt,gradientY(cy-oval,cy+oval,[[0,'#282451'],[.56,'#61518d'],[1,'#25214e']]));
 ctx.save();
 ctx.beginPath();ctx.ellipse(cx,cy,radius,oval,0,0,tau);ctx.clip();
 ctx.translate(cx,cy);ctx.scale(1,.39);
 glow(0,0,100*s,'#e7a0ffb0');
 glow(0,0,56*s,'#ffbf94d0');
 glow(0,0,31*s,'#fff1adc9');
 ctx.restore();
 for(const p of cakeSpecks){
  const angle=p.angle+a;
  const depth=Math.sin(angle);
  if(!p.top&&depth<0)continue;
  const x=cx+Math.cos(angle)*p.radius*s;
  const y=cy+(p.y+depth*p.radius*tilt)*s;
  ctx.globalAlpha=(p.top?.48:.62)*(.67+.33*Math.sin(p.phase+t*1.7)**2);
  ctx.fillStyle=p.color;
  const size=Math.max(.5,p.size*s);
  ctx.fillRect(x,y,size,size);
 }
 ctx.globalAlpha=1;
 // Overlapping frosting pearls use a shaded surface and a soft highlight.
 const pearls=[];
 for(let i=0;i<35;i++){
  const angle=i/35*tau+a;
  pearls.push({x:Math.cos(angle),z:Math.sin(angle)});
 }
 pearls.sort((p,q)=>p.z-q.z);
 for(const p of pearls){
  const x=cx+p.x*radius,y=cy+p.z*oval;
  const r=(10+p.z*1.15)*s;
  const g=ctx.createRadialGradient(x-r*.28,y-r*.42,r*.1,x,y,r);
  g.addColorStop(0,'#ffffff');g.addColorStop(.55,'#f9f4ff');
  g.addColorStop(.86,'#d5d4f3');g.addColorStop(1,'#aaa9d3');
  disc(x,y,r/s,.85,g);
 }
 // Ivory candle with diagonal lavender stripes.
 const candleTop=cy-63*s;
 ctx.save();
 ctx.beginPath();ctx.rect(cx-4*s,candleTop,8*s,63*s);ctx.clip();
 ctx.fillStyle='#fff0da';ctx.fillRect(cx-4*s,candleTop,8*s,63*s);
 ctx.strokeStyle='#bdb0e8';ctx.lineWidth=3.2*s;
 for(let i=0;i<7;i++){
  const y=candleTop+i*10*s;
  ctx.beginPath();ctx.moveTo(cx-5*s,y+6*s);ctx.lineTo(cx+5*s,y-1*s);ctx.stroke();
 }
 ctx.restore();
 ctx.fillStyle=lit?'#fff7d2':'#40324c';ctx.fillRect(cx-s,candleTop-5*s,2*s,6*s);
 if(lit)drawFlame(cx,candleTop-5*s,s,t);
 for(const p of orbitDust){
  const angle=p.angle+a*.73+(reduced?0:t*.09);
  const depth=Math.sin(angle);
  const x=cx+Math.cos(angle)*p.radius*s;
  const y=cy+(p.y+depth*p.radius*.25)*s;
  if(depth<0&&Math.abs(x-cx)<radius&&y>cy-oval&&y<bodyBottom+oval)continue;
  const r=p.size*s;
  ctx.globalAlpha=(depth<0?.49:.84)*(.67+.33*Math.sin(p.phase+t)**2);
  if(p.size>3){
   const g=ctx.createRadialGradient(x-r*.23,y-r*.26,0,x,y,r*1.14);
   g.addColorStop(0,'#fffdf2');g.addColorStop(.26,p.color);
   g.addColorStop(.76,p.color);g.addColorStop(1,'transparent');
   ctx.fillStyle=g;ctx.fillRect(x-r*1.15,y-r*1.15,r*2.3,r*2.3);
  }else{
   ctx.fillStyle=p.color;ctx.fillRect(x,y,r*1.22,r*1.22);
  }
 }
 ctx.globalAlpha=1;
}
function drawFlame(x,y,s,t){
 const flicker=reduced?0:Math.sin(t*6)*3+Math.sin(t*11)*1.5;
 ctx.save();
 ctx.globalCompositeOperation='screen';
 glow(x,y-51*s,150*s,'#9b3a6449');
 glow(x,y-46*s,90*s,'#ff86277f');
 glow(x,y-40*s,56*s,'#ffb942cb');
 glow(x,y-25*s,30*s,'#fff2b6df');
 ctx.beginPath();
 ctx.moveTo(x,y+3*s);
 ctx.bezierCurveTo(x-42*s,y-24*s,x-6*s,y-72*s,x+flicker*s,y-103*s);
 ctx.bezierCurveTo(x+3*s,y-68*s,x+37*s,y-25*s,x,y+3*s);
 ctx.fillStyle=gradientY(y-106*s,y+3*s,[[0,'#fff6c980'],[.29,'#fff5b8'],[.79,'#fffef5'],[1,'#ffffff']]);
 ctx.fill();
 for(let i=0;i<125;i++){
  const u=((reduced?0:t*.47)+i/125)%1, phase=i*2.399;
  ctx.globalAlpha=(1-u)*.9;
  ctx.fillStyle=i%4===0?'#fff7e5':'#ffd661';
  const size=(.55+(i%7)*.19)*s;
  ctx.fillRect(x+Math.sin(phase+u*4)*(10+38*u)*s,y-(15+u*155)*s,size,size);
 }
 ctx.restore();
}
function glow(x,y,r,color){const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,color);g.addColorStop(1,'transparent');ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2);}
let nextMeteor=.7;
let meteor;
function drawMeteor(dt){
 if(reduced)return;
 if(!meteor){
  nextMeteor-=dt;
  if(nextMeteor>0)return;
  meteor={age:0,startX:.06+Math.random()*.48,startY:-.08+Math.random()*.21};
 }
 meteor.age+=dt;
 const progress=meteor.age/1.15;
 if(progress>=1){
  meteor=undefined;
  nextMeteor=2.4+Math.random()*2.8;
  return;
 }
 const travel=Math.min(width*.58,570);
 const x=width*meteor.startX+progress*travel;
 const y=height*meteor.startY+progress*travel*.48;
 const tail=Math.min(116,travel*.27,progress*travel);
 if(tail<=0)return;
 const tailX=x-tail,tailY=y-tail*.48;
 const gradient=ctx.createLinearGradient(tailX,tailY,x,y);
 gradient.addColorStop(0,'transparent');
 gradient.addColorStop(.66,'rgba(163, 182, 255, .36)');
 gradient.addColorStop(1,'#f3ebff');
 ctx.save();
 ctx.globalAlpha=.82*Math.min(1,progress*8,(1-progress)*5);
 ctx.strokeStyle=gradient;
 ctx.lineWidth=1.5;
 ctx.lineCap='round';
 ctx.beginPath();
 ctx.moveTo(tailX,tailY);
 ctx.lineTo(x,y);
 ctx.stroke();
 glow(x,y,8,'#e6d3ff90');
 ctx.restore();
}
function render(now){
 if(!active)return; const dt=Math.min((now-lastTime)/1000||0,.05);lastTime=now;if(!reduced)angle+=dt*.13;const a=angle+dragAngle,t=now/1000;
 ctx.fillStyle='#020205';ctx.fillRect(0,0,width,height);
 glow(width*.5,height*.39,235*scale,'#44205253');
 for(const s of stars){ctx.globalAlpha=.35+.4*Math.sin((reduced?0:t*.5)+s.phase)**2;ctx.fillStyle='#dce0ff';ctx.fillRect(s.x*width,s.y*height,s.size,s.size);}ctx.globalAlpha=1;
 drawMeteor(dt);
 drawCake(a,t);
 for(let i=sparks.length-1;i>=0;i--){const s=sparks[i];s.life-=dt;s.x+=s.vx*dt;s.y+=s.vy*dt;s.vy+=35*dt;ctx.globalAlpha=Math.max(0,s.life/2);ctx.fillStyle=s.color;ctx.fillRect(s.x,s.y,2,2);if(s.life<=0)sparks.splice(i,1);}ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';drawSnow(dt);raf=requestAnimationFrame(render);
}
const musicButton=el('music');
const piano=el('celebration-piano');
let musicMuted=false;
let playbackRequest=0;

function stopMusic(){
 playbackRequest++;
 piano.pause();
 piano.currentTime=0;
 musicButton.textContent='♫ 播放音乐';
}

async function playMusic(){
 const request=++playbackRequest;
 try{
  await piano.play();
  if(request===playbackRequest)musicButton.textContent='♫ 静音';
 }catch{
  if(request===playbackRequest)musicButton.textContent='♫ 播放音乐';
 }
}

piano.onended=()=>{
 musicButton.textContent='♫ 重播音乐';
};
musicButton.onclick=()=>{
 if(piano.paused){
  musicMuted=false;
  void playMusic();
 }else{
  musicMuted=true;
  stopMusic();
 }
};
function start(){active=true;lastTime=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(render);}
el('enter').onclick=()=>{el('heart').hidden=true;el('galaxy').hidden=false;resize();meteor=undefined;nextMeteor=.7;start();if(!musicMuted)void playMusic();el('blow').focus();};
el('back').onclick=()=>{stopMusic();active=false;cancelAnimationFrame(raf);el('galaxy').hidden=true;el('heart').hidden=false;el('enter').focus();};
canvas.onpointerdown=e=>{lastX=e.clientX;canvas.setPointerCapture(e.pointerId);};
canvas.onpointermove=e=>{if(lastX!==null){dragAngle+=(e.clientX-lastX)*.008;lastX=e.clientX;}};
canvas.onpointerup=canvas.onpointercancel=()=>{lastX=null;};
el('color').onclick=()=>{tone=(tone+55)%360;};
el('blow').onclick=()=>{lit=false;el('blow').hidden=true;el('read').hidden=false;el('again').hidden=false;el('cake-title').textContent='愿你，所愿皆成真';el('cake-sub').textContent='这一刻的星光，都属于你';if(!reduced)for(let i=0;i<120;i++){const a=Math.random()*6.28,s=50+Math.random()*130;sparks.push({x:width/2,y:height*.45,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:2,color:'hsl('+Math.random()*360+' 90% 78%)'});}el('read').focus();};
el('again').onclick=()=>{lit=true;el('blow').hidden=false;el('read').hidden=true;el('again').hidden=true;el('cake-title').textContent='星河为你亮起';el('cake-sub').textContent='闭上眼睛，许下新一岁的愿望';el('blow').focus();};
el('read').onclick=()=>{el('letter-wrap').hidden=false;el('galaxy').inert=true;el('close').focus();};
function close(){el('letter-wrap').hidden=true;el('galaxy').inert=false;el('read').focus();}
el('close').onclick=close;el('letter-wrap').onclick=e=>{if(e.target===el('letter-wrap'))close();};el('letter-wrap').onkeydown=e=>{if(e.key==='Escape')close();if(e.key==='Tab'){e.preventDefault();el('close').focus();}};
document.addEventListener('visibilitychange',()=>{if(document.hidden){stopMusic();cancelAnimationFrame(raf);}else if(active)start();});
})();

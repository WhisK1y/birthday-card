<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5dce8"><title>给你一整个星河的祝福</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#080816;color:white}button{font:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:3px solid #e6a9e4;outline-offset:5px}[hidden]{display:none!important}
.screen{position:fixed;inset:0;min-height:100svh;overflow:hidden}#heart{background:radial-gradient(ellipse at 35% 30%,#fff8e9,transparent 55%),radial-gradient(ellipse at 80% 60%,#e7c6f4,transparent 60%),#f8dce7;color:#9b4271;transition:opacity .9s;z-index:2}.heading{position:absolute;top:max(9%,55px);width:100%;text-align:center;z-index:3;pointer-events:none}h1{font-family:Georgia,"Songti SC",serif;font-size:clamp(34px,9vw,60px);margin:0 0 14px;letter-spacing:.12em;font-weight:500}.heading p{font-size:13px;letter-spacing:.2em;opacity:.75}.heart-area{position:absolute;left:50%;top:49%;width:min(86vw,560px);height:min(83vw,530px);transform:translate(-50%,-50%)}.note{position:absolute;width:clamp(80px,21vw,132px);height:clamp(43px,11vw,67px);border:1px solid #ffffffd9;border-radius:5px;background:var(--color);box-shadow:0 3px 10px #73466420;color:#654d61;text-align:center;font-size:clamp(9px,2.4vw,13px);display:flex;align-items:center;justify-content:center;padding:12px 4px 4px;opacity:0;transform:translate(var(--sx),var(--sy)) rotate(var(--angle));animation:arrive .8s cubic-bezier(.2,.75,.2,1) forwards;animation-delay:var(--delay)}.note:before{content:"● ● ●";position:absolute;left:5px;top:3px;font-size:5px;letter-spacing:2px;opacity:.35}.note:after{content:"";position:absolute;top:13px;left:0;right:0;border-top:1px solid #ffffff80}@keyframes arrive{to{opacity:1;transform:translate(-50%,-50%) rotate(var(--angle))}}.center-note{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);width:155px;padding:22px 10px;background:#fff9f2ed;box-shadow:0 8px 30px #b9719c35;text-align:center;border:1px solid white;border-radius:5px;z-index:100;opacity:0;animation:reveal 1s 4.6s forwards;color:#b34d7f}.center-note strong{font-size:21px}.center-note small{display:block;font-size:10px;margin-top:12px;line-height:1.9;letter-spacing:.1em}@keyframes reveal{to{opacity:1}}.bottom{position:absolute;bottom:max(8%,35px);left:18px;right:18px;display:flex;flex-direction:column;align-items:center;gap:14px;z-index:5}.pill{border:1px solid #ffffff60;background:#ffffff16;color:#f7e5ff;border-radius:30px;padding:13px 25px;font-size:14px;backdrop-filter:blur(12px)}#enter{background:#a44775;color:#fff;border:1px solid #a44775;box-shadow:0 8px 24px #a4477535}.caption{font-size:11px;letter-spacing:.15em;opacity:.65}canvas{width:100%;height:100%;display:block;touch-action:pan-y}#galaxy .heading{top:max(9%,55px)}#galaxy h1{font-size:clamp(28px,7vw,45px);color:#f6dcff;text-shadow:0 0 30px #cd71c8}#galaxy .heading p{color:#d2b8dc}.topbar{position:absolute;top:max(20px,env(safe-area-inset-top));left:20px;right:20px;display:flex;justify-content:space-between;z-index:6}.small{background:#ffffff08;border:1px solid #ffffff28;border-radius:30px;color:#dfcfe8;padding:9px 13px;font-size:11px}.controls{display:flex;gap:10px}.letter-wrap{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:25px;background:#070914a8;backdrop-filter:blur(9px)}.letter{width:min(100%,350px);max-height:85svh;overflow:auto;text-align:center;padding:32px 24px;border:1px solid #e0b0e850;border-radius:20px;background:linear-gradient(150deg,#32213ded,#17172dee);box-shadow:0 0 70px #c96cef25}.letter h2{font-family:Georgia,"Songti SC",serif;font-size:27px;color:#ffd5eb}.letter p{font-size:14px;line-height:2.2;color:#e0cce5;margin:24px 0}.letter .star{font-size:35px;color:#f4d3a0} @media(prefers-reduced-motion:reduce){.note{animation-duration:.01ms;animation-delay:0s}.center-note{animation-delay:0s}.screen{transition:none}}
</style></head><body>
<section class="screen" id="heart"><div class="heading"><h1>生日快乐</h1><p>把所有美好的祝福，都送给你</p></div><div class="heart-area" id="notes"><div class="center-note"><strong>生日快乐 ♡</strong><small>愿你新的一岁<br>继续闪闪发光</small></div></div><div class="bottom"><button class="pill" id="enter">收下祝福，去看星河 ✦</button><span class="caption">今天的惊喜，为你准备</span></div></section>
<section class="screen" id="galaxy" hidden><canvas id="sky" aria-label="星空中由发光粒子组成的立体生日蛋糕"></canvas><div class="topbar"><button class="small" id="back">♡ 回到祝福</button><button class="small" id="color">换一种星光</button></div><div class="heading"><h1 id="cake-title">星河为你亮起</h1><p id="cake-sub">闭上眼睛，许下新一岁的愿望</p></div><div class="bottom"><div class="controls"><button class="pill" id="blow">许愿 · 吹灭蜡烛</button><button class="pill" id="read" hidden>拆开生日小信 ♡</button><button class="small" id="again" hidden>重新点亮</button></div><span class="caption">指尖轻划，让星河围着蛋糕转动</span></div></section>
<div class="letter-wrap" id="letter-wrap" hidden><section class="letter" role="dialog" aria-modal="true" aria-labelledby="letter-title"><div class="star">✦</div><h2 id="letter-title">生日快乐</h2><p>愿你新的一岁，<br>有热爱的事，有惦记的人，<br>有说走就走的勇气，<br>也有慢慢生活的底气。</p><p>愿你抬头有星光，身边有温暖。<br>刚刚许下的愿望，<br>都在未来的某一天，悄悄实现。</p><button class="pill" id="close">收好这份祝福 ♡</button></section></div>
<script>
(function(){
'use strict';
const el=id=>document.getElementById(id);
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const phrases=['天天开心 ☀','平安顺遂 ♡','好运常在 ✦','万事胜意','愿望都实现','快乐加倍 ♡','永远有趣','自在发光 ✧','常有好事发生','所遇皆温柔','勇敢做自己','有空就去玩','睡个好觉 ☁','新的一岁超棒','好梦都成真','一切都刚刚好','喜欢的人常见','快乐不止今天'];
const palette=['#fbdde8','#dbebdf','#e4ddf5','#fff0ca','#dce9f8','#f9e1d1'];
for(let i=0;i<76;i++){
 const t=i/76*Math.PI*2;
 const x=16*Math.pow(Math.sin(t),3);
 const y=13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);
 const card=document.createElement('div');card.className='note';card.textContent=phrases[i%phrases.length];
 card.style.left=(50+x*2.35)+'%';card.style.top=(47-y*2.6)+'%';
 card.style.setProperty('--color',palette[i%6]);card.style.setProperty('--angle',(Math.sin(i*1.8)*8)+'deg');
 card.style.setProperty('--sx',(Math.cos(i*2.4)*800)+'px');card.style.setProperty('--sy',(Math.sin(i*2.4)*800)+'px');card.style.setProperty('--delay',(i*.055)+'s');
 el('notes').appendChild(card);
}
const canvas=el('sky'),ctx=canvas.getContext('2d');
let width=0,height=0,scale=1,angle=0,dragAngle=0,lastX=null,lit=true,active=false,raf=0,lastTime=0,tone=0;
const particles=[],stars=[],sparks=[];
const snowflakes=Array.from({length:85},(_,i)=>({x:Math.random(),y:Math.random(),r:i%5===0?3+Math.random()*2:1+Math.random()*1.7,speed:14+Math.random()*25,phase:Math.random()*Math.PI*2,rotation:Math.random()*Math.PI}));
let snowTime=0;
function drawSnow(dt){
 if(!reduced)snowTime+=dt;
 ctx.save();ctx.globalCompositeOperation='source-over';ctx.strokeStyle='#edf6ff';ctx.fillStyle='#edf6ff';
 const count=width<600?55:85;
 for(let i=0;i<count;i++){
  const f=snowflakes[i];
  if(!reduced){f.y+=dt*f.speed/(height+20);if(f.y>1.02){f.y=-.02;f.x=Math.random();}}
  const x=f.x*width+Math.sin(snowTime*.55+f.phase)*18,y=f.y*height;
  ctx.globalAlpha=f.r>3?.65:.25+f.r*.13;
  if(f.r>3){
   ctx.save();ctx.translate(x,y);ctx.rotate(f.rotation+snowTime*.13);ctx.lineWidth=.8;ctx.beginPath();
   for(let k=0;k<6;k++){const a=k*Math.PI/3,c=Math.cos(a),s=Math.sin(a);ctx.moveTo(0,0);ctx.lineTo(c*f.r,s*f.r);for(const side of [-1,1]){const b=a+side*.85;ctx.moveTo(c*f.r*.58,s*f.r*.58);ctx.lineTo(c*f.r*.58-Math.cos(b)*f.r*.3,s*f.r*.58-Math.sin(b)*f.r*.3);}}
   ctx.stroke();ctx.restore();
  }else{ctx.beginPath();ctx.arc(x,y,f.r,0,Math.PI*2);ctx.fill();}
 }
 ctx.restore();
}
function point(x,y,z,hue,size=1,group='cake'){particles.push({x,y,z,hue,size,group,seed:Math.random()*6.28});}
function ring(radius,y,count,hue,size=1){for(let i=0;i<count;i++){const a=i/count*Math.PI*2;point(Math.cos(a)*radius,y,Math.sin(a)*radius,hue,size);}}
for(let i=0;i<300;i++)stars.push({x:Math.random(),y:Math.random(),size:Math.random()*1.3+.25,phase:Math.random()*6.28});
for(let i=0;i<3800;i++){const a=Math.random()*Math.PI*2,y=20+Math.random()*94;point(Math.cos(a)*96,y,Math.sin(a)*96,230+Math.random()*75,Math.random()*.9+.5);}
for(let i=0;i<2100;i++){const a=Math.random()*Math.PI*2,r=Math.sqrt(Math.random())*96;point(Math.cos(a)*r,19,Math.sin(a)*r,295+Math.random()*60,Math.random()*.8+.5);}
for(let j=0;j<5;j++){ring(97+j*.6,18+j*.9,260,315,1);ring(97,110+j,220,265,1);}
for(let i=0;i<1300;i++){const a=Math.random()*Math.PI*2;const y=20+Math.random()*(9+16*Math.pow((Math.sin(a*10)+1)/2,3));point(Math.cos(a)*98,y,Math.sin(a)*98,330+Math.random()*25,1);}
for(let i=0;i<12;i++){const a=i/12*Math.PI*2;for(let k=0;k<60;k++){const b=Math.random()*Math.PI*2,r=Math.random()*6;point(Math.cos(a)*79+Math.cos(b)*r,12-Math.random()*8,Math.sin(a)*79+Math.sin(b)*r,335,1.1);}}
for(let y=-53;y<17;y+=1.2){ring(6,y,12,((y+55)%14<7)?310:45,1.2);}
for(let i=0;i<4;i++)ring(118+i*2,120+i,340,260+i*9,.8);
for(let i=0;i<1050;i++){const a=Math.random()*Math.PI*2,r=130+Math.random()*65;point(Math.cos(a)*r,Math.random()*200-65,Math.sin(a)*r,Math.random()*360,.5+Math.random(), 'dust');}
function resize(){width=innerWidth;height=innerHeight;const dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);scale=Math.min(width/470,height/670,1.75);}
addEventListener('resize',resize);resize();
function project(x,y,z,a){const rx=x*Math.cos(a)+z*Math.sin(a),rz=z*Math.cos(a)-x*Math.sin(a);const ry=y*.91-rz*.42,depth=y*.42+rz*.91;const p=650/(650+depth);return{x:width/2+rx*scale*p,y:height*.52+ry*scale*p,s:p,z:depth};}
function glow(x,y,r,color){const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,color);g.addColorStop(1,'transparent');ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2);}
function render(now){
 if(!active)return; const dt=Math.min((now-lastTime)/1000||0,.05);lastTime=now;if(!reduced)angle+=dt*.13;const a=angle+dragAngle,t=now/1000;
 ctx.fillStyle='#080816';ctx.fillRect(0,0,width,height);
 glow(width*.5,height*.59,width*.68,'#30174545');glow(width*.15,height*.4,width*.5,'#14295730');
 for(const s of stars){ctx.globalAlpha=.35+.4*Math.sin((reduced?0:t*.5)+s.phase)**2;ctx.fillStyle='#dce0ff';ctx.fillRect(s.x*width,s.y*height,s.size,s.size);}ctx.globalAlpha=1;
 const list=particles.map(p=>{let x=p.x,y=p.y,z=p.z;if(p.group==='dust'){const rot=reduced?0:t*.1;const xx=x*Math.cos(rot)+z*Math.sin(rot);z=z*Math.cos(rot)-x*Math.sin(rot);x=xx;y+=Math.sin(t*.5+p.seed)*5;}return{p,v:project(x,y,z,a)};}).sort((a,b)=>b.v.z-a.v.z);
 ctx.globalCompositeOperation='lighter';
 for(const item of list){const p=item.p,v=item.v;const hue=(p.hue+tone)%360;ctx.globalAlpha=p.group==='dust'?.35+.4*Math.sin(t+p.seed)**2:.72;ctx.fillStyle='hsl('+hue+' 85% '+(p.group==='cake'?75:68)+'%)';const size=p.size*scale*v.s;ctx.beginPath();ctx.arc(v.x,v.y,Math.max(.35,size),0,Math.PI*2);ctx.fill();}
 ctx.globalAlpha=1;
 for(let j=0;j<2;j++)for(let i=0;i<240;i++){const b=i/240*Math.PI*2+(reduced?0:t*.18);const p=project(Math.cos(b)*(155+j*20),-23+Math.sin(b)*40+j*7,Math.sin(b)*(155+j*20),a+.5);ctx.fillStyle='hsla('+((280+tone+i*.3)%360)+' 85% 83% / .55)';ctx.fillRect(p.x,p.y,scale,scale);}
 if(lit){const flame=project(0,-70,0,a);glow(flame.x,flame.y,36*scale,'#ff9e2345');glow(flame.x,flame.y,15*scale,'#ffbd52b0');ctx.fillStyle='#fff3b0';ctx.beginPath();ctx.ellipse(flame.x,flame.y,5*scale,(13+Math.sin(t*8))*scale,-.12,0,Math.PI*2);ctx.fill();for(let i=0;i<35;i++){const u=(t*.5+i/35)%1;ctx.globalAlpha=1-u;ctx.fillStyle='#ffd98b';ctx.fillRect(flame.x+Math.sin(i*7+t)*u*22*scale,flame.y-u*66*scale,1.5*scale,1.5*scale);}ctx.globalAlpha=1;}
 for(let i=sparks.length-1;i>=0;i--){const s=sparks[i];s.life-=dt;s.x+=s.vx*dt;s.y+=s.vy*dt;s.vy+=35*dt;ctx.globalAlpha=Math.max(0,s.life/2);ctx.fillStyle=s.color;ctx.fillRect(s.x,s.y,2,2);if(s.life<=0)sparks.splice(i,1);}ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';drawSnow(dt);raf=requestAnimationFrame(render);
}
function start(){active=true;lastTime=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(render);}
el('enter').onclick=()=>{el('heart').hidden=true;el('galaxy').hidden=false;resize();start();el('blow').focus();};
el('back').onclick=()=>{active=false;cancelAnimationFrame(raf);el('galaxy').hidden=true;el('heart').hidden=false;el('enter').focus();};
canvas.onpointerdown=e=>{lastX=e.clientX;canvas.setPointerCapture(e.pointerId);};
canvas.onpointermove=e=>{if(lastX!==null){dragAngle+=(e.clientX-lastX)*.008;lastX=e.clientX;}};
canvas.onpointerup=canvas.onpointercancel=()=>{lastX=null;};
el('color').onclick=()=>{tone=(tone+55)%360;};
el('blow').onclick=()=>{lit=false;el('blow').hidden=true;el('read').hidden=false;el('again').hidden=false;el('cake-title').textContent='愿你，所愿皆成真';el('cake-sub').textContent='这一刻的星光，都属于你';if(!reduced)for(let i=0;i<120;i++){const a=Math.random()*6.28,s=50+Math.random()*130;sparks.push({x:width/2,y:height*.45,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:2,color:'hsl('+Math.random()*360+' 90% 78%)'});}el('read').focus();};
el('again').onclick=()=>{lit=true;el('blow').hidden=false;el('read').hidden=true;el('again').hidden=true;el('cake-title').textContent='星河为你亮起';el('cake-sub').textContent='闭上眼睛，许下新一岁的愿望';el('blow').focus();};
el('read').onclick=()=>{el('letter-wrap').hidden=false;el('galaxy').inert=true;el('close').focus();};
function close(){el('letter-wrap').hidden=true;el('galaxy').inert=false;el('read').focus();}
el('close').onclick=close;el('letter-wrap').onclick=e=>{if(e.target===el('letter-wrap'))close();};el('letter-wrap').onkeydown=e=>{if(e.key==='Escape')close();if(e.key==='Tab'){e.preventDefault();el('close').focus();}};
document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelAnimationFrame(raf);}else if(active)start();});
})();
</script></body></html>
